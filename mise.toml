[settings]
experimental = true

[tools]
xcodegen = '2.45.3'

[tasks.models]
description = 'Put the Clips and Title models where the app looks for them'
run = 'Tools/build-models.py'

[tasks.generate]
description = 'Generate Clipper.xcodeproj from project.yml'
# A literal string: the check below is full of backslashes, and a basic
# multi-line string would read them as TOML escapes.
run = '''
# The core's version floor is declared twice, because an Xcode project cannot
# declare a package trait and `Packages/MLXTrait` exists to turn on `MLX`.
# SwiftPM resolves the union of the two ranges and says nothing useful when
# they stop overlapping, so they are compared here instead.
PROJECT=$(grep -A5 '^  DesertAntCore:' project.yml | sed -n 's/^ *from: *//p' | head -1)
TRAIT=$(sed -n 's/.*desert-ant-core\.git", from: "\([^"]*\)".*/\1/p' Packages/MLXTrait/Package.swift)
if [ "$PROJECT" != "$TRAIT" ]; then
    echo "The desert-ant-core floor differs: project.yml says $PROJECT, Packages/MLXTrait says $TRAIT."
    echo "Bump both together, or SwiftPM fails without naming the cause."
    exit 1
fi
xcodegen generate
'''

[tasks.xcode]
description = 'Generate the project and open it in Xcode'
depends = ['generate']
run = """
# The binary rather than `open -a Xcode`, so the project opens in a new
# instance rather than being handed to one that is already running.
nohup "$(xcode-select -p)/../MacOS/Xcode" Clipper.xcodeproj >/dev/null 2>&1 &
echo "📂 Opening Clipper.xcodeproj"
"""

[tasks.build]
description = 'Build the app, signed with your certificate when CLIPPER_TEAM_ID is set'
depends = ['generate']
run = """
set -o pipefail
# Release rather than Debug: the model runs through MLX, and a debug build of
# it is slow enough to change how the app feels.
ARGS=(-project Clipper.xcodeproj -scheme Clipper
      -configuration Release -destination 'platform=macOS,arch=arm64'
      -derivedDataPath build ARCHS=arm64
      -skipPackagePluginValidation -skipMacroValidation)

if [ -n "${CLIPPER_TEAM_ID:-}" ]; then
    echo "🔏 Signing with team $CLIPPER_TEAM_ID"
    ARGS+=(DEVELOPMENT_TEAM="$CLIPPER_TEAM_ID" CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates)
else
    echo "🔏 No CLIPPER_TEAM_ID, signing to this machine only"
fi

xcodebuild "${ARGS[@]}" build | grep -E 'error:|warning:|BUILD' || true
echo "📦 build/Build/Products/Release/Clipper.app"
"""

[tasks.run]
description = 'Build and open the app'
depends = ['build']
run = 'open build/Build/Products/Release/Clipper.app'

[tasks.cli]
description = 'Build the clipper command line tool'
depends = ['generate']
run = """
set -o pipefail
xcodebuild -project Clipper.xcodeproj -scheme ClipperCLI \
    -configuration Release -destination 'platform=macOS,arch=arm64' \
    -derivedDataPath build ARCHS=arm64 \
    -skipPackagePluginValidation -skipMacroValidation \
    build | grep -E 'error:|warning:|BUILD' || true
echo "📦 build/Build/Products/Release/clipper"
"""

[tasks.test]
description = 'Run the tests over the shared sources'
depends = ['generate']
run = """
set -o pipefail
xcodebuild -project Clipper.xcodeproj -scheme ClipperTests \
    -destination 'platform=macOS,arch=arm64' \
    -derivedDataPath build ARCHS=arm64 \
    -skipPackagePluginValidation -skipMacroValidation \
    test | grep -E 'error:|Test run|Suite .* (passed|failed)|\\*\\* TEST' || true
"""

[tasks.package]
description = 'Build the app and wrap it in a disk image for someone else'
run = 'Scripts/package.sh'

[tasks.clean]
description = 'Remove build products, the generated project, and disk images'
run = 'rm -rf build dist Clipper.xcodeproj'
